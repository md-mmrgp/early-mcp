# À chaque push sur main : on lance les tests, puis on construit l'image Docker
# et on la publie sur le registre GitHub (ghcr.io). Aucun secret : le GITHUB_TOKEN est fourni par GitHub.
name: image

on:
  push:
    branches: [main]
  workflow_dispatch:   # permet aussi de le lancer à la main depuis l'onglet Actions

permissions:
  contents: read       # par défaut, lecture seule pour tous les jobs

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run pytest -q

  image:
    needs: tests       # pas d'image si les tests échouent
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # uniquement ce job peut publier l'image
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
